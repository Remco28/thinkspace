name: thinkspace
description: A lightweight visual idea workspace for combining images, lines and layers to explain an idea.
publish_to: none
version: 0.11.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  file_selector: ^1.0.3
  desktop_drop: ^0.8.4
  ffi: ^2.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora.ttf
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat.ttf
