name: CI

on:
  push:
    branches: [main, windows-port]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev xvfb desktop-file-utils
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: desktop-file-validate packaging/io.github.remco28.thinkspace.desktop
      - run: flutter analyze
      - run: flutter test
      - name: Build (release)
        run: flutter build linux --release

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - name: Installer tool
        run: choco install innosetup -y --no-progress
      - name: Build and package (release)
        shell: pwsh
        run: tool/package_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: thinkspace-windows-x64
          path: |
            dist/thinkspace-windows-x64.zip
            dist/Thinkspace-Setup.exe
