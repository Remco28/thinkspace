name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev xvfb desktop-file-utils
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: desktop-file-validate packaging/io.github.remco28.thinkspace.desktop
      - run: flutter analyze
      - run: flutter test
      - name: Build (release)
        run: flutter build linux --release
